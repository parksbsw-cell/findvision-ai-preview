name: Preview checks

on:
  push:
    branches: [feat/isolated-streamlit-preview]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py preview_logic.py
      - run: ruff check .
      - run: pytest -q
